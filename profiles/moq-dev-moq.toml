# https://github.com/5062/moq/tree/moq-trace
# Build: `just build-moq-dev-moq` in the workspace.
#
# The relay generates its own certificate, and anyone may publish or subscribe.
# Like upstream, it installs no SIGINT handler, so a graceful stop would read as
# a crash. A killed relay can leave its qlog's last record half written, which
# the analysis ignores.
checkout = "relays/moq-dev-moq"
relay_bin = "target/release/moq-relay"
relay_args = [
  "--server-bind", "[::]:{port}",
  "--server-backend", "quinn",
  "--server-version", "{protocol}",
  "--tls-generate", "localhost",
  "--auth-public", "",
]
# Run in the relay's checkout on a remote relay host before each run. It builds
# through the workspace recipe, against the pinned toolkit and forks, and sets
# NIX_CONFIG so a host whose Nix leaves flakes off still builds.
relay_build = "cd \"$(git rev-parse --show-superproject-working-tree)\" && NIX_CONFIG='extra-experimental-features = nix-command flakes' nix develop --command just build-moq-dev-moq"
relay_graceful_stop = false
transport_profile = "quinn"
