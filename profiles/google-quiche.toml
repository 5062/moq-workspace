# https://github.com/5062/quiche/moq-trace
# Build: `just build-google-quiche` in the workspace.
#
# The relay listens on IPv4 only and logs no readiness marker, so the runner
# waits a fixed startup delay, and a peer on the relay's host dials the IPv4
# loopback, since `localhost` may resolve to IPv6 first. It binds every IPv4
# interface, so peers on other hosts reach it too. It installs no SIGINT
# handler, so a graceful stop would read as a crash. QUICHE emits no Quinn
# routing or scheduling phases.
checkout = "relays/google-quiche"
# The relay host initializes these besides the suite's submodules.
submodules = ["relays/google-quiche"]
relay_bin = "bazel-bin/quiche/moqt_relay"
relay_args = [
  "--bind_address", "0.0.0.0",
  "--port", "{port}",
  "--certificate_file", "{certificate}",
  "--key_file", "{key}",
  "--v=1",
]
relay_ready_log = ""
relay_graceful_stop = false
relay_local_host = "127.0.0.1"
# Run in the relay's checkout on a remote relay host before each run. It builds
# through the workspace recipe, against the pinned toolkit and forks, and sets
# NIX_CONFIG so a host whose Nix leaves flakes off still builds.
relay_build = "cd \"$(git rev-parse --show-superproject-working-tree)\" && NIX_CONFIG='extra-experimental-features = nix-command flakes' nix develop --command just build-google-quiche"
# The recipe installs the pinned toolkit first, so the relay never compiles
# against an install older than the event contract the analysis reads. The
# relay host needs devenv, which QUICHE's build shell comes from.
transport_profile = "generic"
