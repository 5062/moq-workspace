# https://github.com/5062/moxygen/tree/moq-trace
# Build: `just build-facebook-moxygen` in the workspace.
#
# The relay logs no readiness marker at its default verbosity, so the runner
# waits a fixed startup delay. It binds IPv4 and IPv6 and stops cleanly on
# SIGINT. `-endpoint /` serves WebTransport at the path-less URL the runner
# dials, `-versions 16` offers only the bench peers' draft, and
# `-max_cached_tracks 0` disables the relay cache, which the other relays lack
# (`-enable_cache` is never read). The relay does not announce a namespace back
# to the session that published it, so a workload that subscribes to its own
# broadcast receives nothing. The relay keeps stock moxygen's read path, folly's
# read callback, whose system calls the traced build times through a folly
# patch and an mvfst read dispatcher.
checkout = "relays/facebook-moxygen"
# The relay host initializes these besides the suite's submodules.
submodules = ["relays/facebook-moxygen", "deps/mvfst"]
relay_bin = "_build/moxygen/relay/moqrelayserver"
relay_args = [
  "-port", "{port}",
  "-cert", "{certificate}",
  "-key", "{key}",
  "-endpoint", "/",
  "-versions", "16",
  "-max_cached_tracks", "0",
]
relay_ready_log = ""
relay_startup_seconds = 1.0
# Run in the relay's checkout on a remote relay host before each run. It builds
# through the workspace recipe, against the pinned toolkit and forks, and sets
# NIX_CONFIG so a host whose Nix leaves flakes off still builds.
relay_build = "cd \"$(git rev-parse --show-superproject-working-tree)\" && NIX_CONFIG='extra-experimental-features = nix-command flakes' nix develop --command just build-facebook-moxygen"
# The recipe installs the pinned toolkit first, so the relay never compiles
# against an install older than the event contract the analysis reads.
transport_profile = "generic"
